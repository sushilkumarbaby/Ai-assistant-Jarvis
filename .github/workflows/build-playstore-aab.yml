name: Build Play Store AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build Installable Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Installable Debug APK (Ready for Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-installable-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Release Bundle & APK (Optional)
        continue-on-error: true
        run: ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Release Artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
