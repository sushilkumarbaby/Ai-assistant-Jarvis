name: Build Play Store AAB & APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Build Debug & Release APK and AAB Bundle
        run: ./gradlew assembleDebug assembleRelease bundleRelease || ./gradlew assembleDebug

      - name: Upload Installable Debug APK (Ready for Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-installable-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-playstore-bundle
          path: app/build/outputs/bundle/release/*.aab
